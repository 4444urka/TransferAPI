name: Push to Develop

on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment variables
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build and start containers
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for database to initialize
        run: sleep 15

      - name: Run tests
        run: docker compose exec -T web python src/manage.py test

      - name: Stop containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Deploy to development server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            # Переход в директорию проекта на дев-сервере
            cd ${{ secrets.DEV_PROJECT_PATH }}

            # Получение последних изменений из ветки develop
            git fetch origin develop
            git reset --hard origin/develop

            # Пересборка и перезапуск контейнеров
            docker compose -f docker-compose.yml down
            docker compose -f docker-compose.yml up -d --build

            # Опционально: применение миграций
            docker compose exec -T web python src/manage.py migrate
