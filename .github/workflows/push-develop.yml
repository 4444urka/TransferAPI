name: Push to Develop

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build Docker Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Compose services
        run: docker compose build

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to start
        run: sleep 10

      - name: Create migrations
        run: docker compose exec -T web python src/manage.py makemigrations

      - name: Run migrations
        run: docker compose exec -T web python src/manage.py migrate

      - name: Run tests
        run: docker compose exec -T web python src/manage.py test

      - name: Stop services
        if: always()
        run: docker compose down

  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy to development server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            # Переход в директорию проекта на дев-сервере
            cd ${{ secrets.DEV_PROJECT_PATH }}

            # Получение последних изменений из ветки develop
            git fetch origin develop
            git reset --hard origin/develop

            # Пересборка и перезапуск контейнеров
            docker compose -f docker-compose.yml down
            docker compose -f docker-compose.yml up -d --build

            # Применение миграций
            docker compose exec -T web python src/manage.py migrate
