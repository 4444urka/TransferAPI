services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-transfer_db}
      POSTGRES_USER: ${DB_USER:-busser_killer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MbU?rU9&^FfBWrv&s=tw}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busser_killer -d transfer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/utils/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    container_name: telegram_bot
    command: python src/bot/main.py
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    depends_on:
      - web
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import psutil; exit(0 if any(proc.name() == 'python' and 'bot/main.py' in ' '.join(proc.cmdline()) for proc in psutil.process_iter()) else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    depends_on:
      - rabbitmq
      - web
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${DB_USER:-busser_killer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-password}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    command: celery -A config beat
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    depends_on:
      - rabbitmq
      - web
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  postgres_data:
  redis_data:
